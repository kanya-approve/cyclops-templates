---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-pixelmon
  namespace: apps
spec:
  chart:
    spec:
      chart: minecraft-java
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: truecharts
  driftDetection:
    mode: enabled
  interval: 50m
  values:
    common:
      ingress:
        main:
          enabled: {{ eq .Values.accessType "ingress" }}
          {{ if .Values.ingressClassName }}
          ingressClassName: {{ .Values.ingressClassName }}
          {{ end }}
          annotations:
            cloudflare-tunnel-ingress-controller.strrl.dev/backend-protocol: tcp
          hosts:
            - host: {{ .Release.Name }}-pixelmon-mc.{{ .Values.domain }}
              paths:
                - path: /
                  pathType: Prefix
      configmap:
        settings:
          data:
            bukkit.yml: |
              spawn-limits:
                ambient: 1
                animals: 5
                axolotls: 3
                monsters: 20
                water-ambient: 2
                water-animals: 2
                water-underground-creature: 3
              ticks-per:
                ambient-spawns: 400
                animal-spawns: 400
                axolotl-spawns: 400
                monster-spawns: 10
                water-ambient-spawns: 400
                water-spawns: 400
                water-underground-creature-spawns: 400
            mohist.yml: |
              forge:
                bukkitpermissionshandler: false
              worldmanage: true
            paper.yml: |
              settings:
                velocity-support:
                  enabled: false
            paper-global.yml: |
              proxies:
                velocity:
                  enabled: false
            purpur.yml: |
              dolphin:
                disable-treasure-searching: true
              entities-can-use-portals: false
              teleport-if-outside-border: true
              use-alternate-keepalive: true
              villager:
                lobotomize:
                  enabled: true
                search-radius:
                  acquire-poi: 16
                  nearest-bad-sensor: 16
              zombie:
                aggressive-towards-villager-when-lagging: false
            youer.yml: |
              forge:
                bukkitpermissionshandler: false
              worldmanage: true
          enabled: true
          namespace: apps
    persistence:
      backups:
        enabled: false
      bukkit:
        defaultMode: "0664"
        enabled: true
        expandObjectName: true
        mountPath: /config/bukkit.yml
        objectName: settings
        subPath: bukkit.yml
        type: configmap
      data:
        enabled: true
        size: {{ .Values.diskSpace }}
        storageClass: {{ .Values.storageClass }}
        type: pvc
      mohist:
        defaultMode: "0664"
        enabled: true
        expandObjectName: true
        mountPath: /config/mohist-config/mohist.yml
        objectName: settings
        subPath: mohist.yml
        type: configmap
      youer:
        defaultMode: "0664"
        enabled: true
        expandObjectName: true
        mountPath: /config/youer-config/youer.yml
        objectName: settings
        subPath: youer.yml
        type: configmap
    portal:
      open:
        enabled: false
    service:
      main:
        type: {{ if eq .Values.accessType "loadbalancer" }}LoadBalancer{{ else if eq .Values.accessType "nodeport" }}NodePort{{ else }}ClusterIP{{ end }}
        ports:
          {{ if and (eq .Values.accessType "nodeport") .Values.nodePort }}
          main:
            nodePort: {{ .Values.nodePort }}
          {{ end }}
          query:
            enabled: false
      rcon:
        enabled: true
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                COPY_CONFIG_DEST: /data
                DIFFICULTY: normal
                ENABLE_QUERY: false
                LUCKPERMS_DATA_ADDRESS:
                  secretKeyRef:
                    expandObjectName: false
                    key: LUCKPERMS_DB_ADDRESS
                    name: infisical-managed-secrets
                LUCKPERMS_DATA_DATABASE:
                  secretKeyRef:
                    expandObjectName: false
                    key: LUCKPERMS_DB_USERNAME
                    name: infisical-managed-secrets
                LUCKPERMS_DATA_PASSWORD:
                  secretKeyRef:
                    expandObjectName: false
                    key: LUCKPERMS_DB_PASSWORD
                    name: infisical-managed-secrets
                LUCKPERMS_DATA_POOL_SETTINGS_MAXIMUM_POOL_SIZE: 3
                LUCKPERMS_DATA_USERNAME:
                  secretKeyRef:
                    expandObjectName: false
                    key: LUCKPERMS_DB_USERNAME
                    name: infisical-managed-secrets
                LUCKPERMS_MESSAGING_SERVICE: sql
                LUCKPERMS_STORAGE_METHOD: mariadb
                LUCKPERMS_SYNC_MINUTES: -1
                MAX_WORLD_SIZE: 2500
                MEMORY: 6144M
                MODRINTH_ALLOWED_VERSION_TYPE: alpha
                MODRINTH_DOWNLOAD_DEPENDENCIES: required
                MODRINTH_PROJECTS: {{ default "" (join "," .Values.modrinthProjects) }}
                MOTD: "Welcome to the Pixelmon Minecraft Server: {{ printf "%s%s" (upper (substr 0 1 .Release.Name)) (substr 1 (len .Release.Name) .Release.Name) }}"
                NETWORK_COMPRESSION_THRESHOLD: 256
                ONLINE_MODE: true
                PAPER_CONFIG_REPO: https://raw.githubusercontent.com/Alpha018/paper-config-optimized/main
                PLUGINS: >
                  https://github.com/dmulloy2/ProtocolLib/releases/download/5.4.0/ProtocolLib.jar,
                  https://github.com/EssentialsX/Essentials/releases/download/2.22.0/EssentialsX-2.22.0.jar,
                  https://hangarcdn.papermc.io/plugins/LOOHP/InteractiveChat/versions/2026.1.1/PAPER/InteractiveChat-2026.1.1.0.jar
                PVP: true
                RCON_ENABLED: true
                SIMULATION_DISTANCE: 4
                SNOOPER_ENABLED: false
                SPIGET_RESOURCES: {{ default "6245,28140,34315,81534,84278" (join "," .Values.spigotPluginIds) }}
                TYPE: YOUER
                USE_AIKAR_FLAGS: true
                VERSION: 1.21.1
                VIEW_DISTANCE: 7
                {{ if .Values.worldUrl }}
                WORLD: {{ .Values.worldUrl }}
                {{ end }}
              probes:
                startup:
                  spec:
                    initialDelaySeconds: 30
                    failureThreshold: 120 # ~10min window for cold mod downloads; ready ~1min on warm starts
            mcbackup:
              enabled: false
    resources:
      limits:
        cpu: 3000m
        memory: 8Gi
      requests:
        cpu: 1000m
        memory: 8Gi
