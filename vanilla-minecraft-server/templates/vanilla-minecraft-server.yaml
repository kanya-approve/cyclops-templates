---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}
  namespace: apps
spec:
  chart:
    spec:
      chart: minecraft-java
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: truecharts
  interval: 50m
  values:
    common:
      configmap:
        settings:
          data:
            bukkit.yml: |
              spawn-limits:
                ambient: 1
                animals: 5
                axolotls: 3
                monsters: 20
                water-ambient: 2
                water-animals: 2
                water-underground-creature: 3
              ticks-per:
                ambient-spawns: 400
                animal-spawns: 400
                axolotl-spawns: 400
                monster-spawns: 10
                water-ambient-spawns: 400
                water-spawns: 400
                water-underground-creature-spawns: 400
            paper.yml: |
              settings:
                velocity-support:
                  enabled: true
            paper-global.yml: |
              proxies:
                velocity:
                  enabled: true
            purpur.yml: |
              dolphin:
                disable-treasure-searching: true
              entities-can-use-portals: false
              teleport-if-outside-border: true
              use-alternate-keepalive: true
              villager:
                lobotomize:
                  enabled: true
                search-radius:
                  acquire-poi: 16
                  nearest-bad-sensor: 16
              zombie:
                aggressive-towards-villager-when-lagging: false
          enabled: true
          namespace: apps
    service:
      main:
        ports:
          query:
            enabled: false
      rcon:
        enabled: true
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                COPY_CONFIG_DEST: /data
                DIFFICULTY: normal
                ENABLE_QUERY: false
                LUCKPERMS_DATA_ADDRESS:
                  secretKeyRef:
                    expandObjectName: false
                    key: ADDRESS
                    name: minecraft-proxy-luckperms
                LUCKPERMS_DATA_DATABASE:
                  secretKeyRef:
                    expandObjectName: false
                    key: DATABASE
                    name: minecraft-proxy-luckperms
                LUCKPERMS_DATA_PASSWORD:
                  secretKeyRef:
                    expandObjectName: false
                    key: PASSWORD
                    name: minecraft-proxy-luckperms
                LUCKPERMS_DATA_POOL_SETTINGS_MAXIMUM_POOL_SIZE:
                  secretKeyRef:
                    expandObjectName: false
                    key: POOL_SETTINGS_MAXIMUM_POOL_SIZE
                    name: minecraft-proxy-luckperms
                LUCKPERMS_DATA_USERNAME:
                  secretKeyRef:
                    expandObjectName: false
                    key: USERNAME
                    name: minecraft-proxy-luckperms
                LUCKPERMS_MESSAGING_SERVICE: pluginmsg
                LUCKPERMS_STORAGE_METHOD:
                  secretKeyRef:
                    expandObjectName: false
                    key: STORAGE_METHOD
                    name: minecraft-proxy-luckperms
                LUCKPERMS_SYNC_MINUTES: -1
                MAX_WORLD_SIZE: 2500
                MODRINTH_ALLOWED_VERSION_TYPE: alpha
                MODRINTH_DOWNLOAD_DEPENDENCIES: required
                MODRINTH_PROJECTS: {{ default "" (join "," .Values.modrinthProjects) }}
                MOTD: "Welcome to the Vanilla Minecraft Server: {{ printf "%s%s" (upper (substr 0 1 .Release.Name)) (substr 1 (len .Release.Name) .Release.Name) }}"
                NETWORK_COMPRESSION_THRESHOLD: 256
                ONLINE_MODE: false
                PAPER_CONFIG_REPO: https://raw.githubusercontent.com/Alpha018/paper-config-optimized/main
                PAPER_VELOCITY_SECRET: 
                  secretKeyRef:
                    expandObjectName: false
                    key: VELOCITY_FORWARDING_SECRET
                    name: minecraft-proxy-velocity
                PLUGINS: >
                  https://github.com/dmulloy2/ProtocolLib/releases/download/5.4.0/ProtocolLib.jar,
                  https://github.com/EssentialsX/Essentials/releases/download/2.21.2/EssentialsX-2.21.2.jar,
                  https://github.com/IntellectualSites/FastAsyncWorldEdit/releases/download/2.15.0/FastAsyncWorldEdit-Paper-2.15.0.jar,
                  https://github.com/oddlama/vane/releases/download/v1.21.1/all-plugins.zip,
                  https://hangarcdn.papermc.io/plugins/LOOHP/InteractiveChat/versions/4.3.5/PAPER/InteractiveChat-4.3.5.0.jar
                PVP: true
                RCON_ENABLED: true
                SIMULATION_DISTANCE: 4
                SNOOPER_ENABLED: false
                SPIGET_RESOURCES: {{ default "6245,28140,34315,81534,83767,84278" (join "," .Values.spigotPluginIds) }}
                TYPE: PURPUR
                USE_AIKAR_FLAGS: true
                {{ if .Values.modrinthProjects }}
                VERSION_FROM_MODRINTH_PROJECTS: true
                {{ else }}
                VERSION: LATEST
                VERSION_FROM_MODRINTH_PROJECTS: false
                {{ end }}
                VIEW_DISTANCE: 7
                {{ if .Values.worldUrl }}
                WORLD: {{ .Values.worldUrl }}
                {{ end }}
            mcbackup:
              enabled: false
          labels:
            kuvel.azisaba.net/enable-server-discovery: "true"
            kuvel.azisaba.net/preferred-server-name: {{ .Release.Name }}-vanilla
    persistence:
      backups:
        enabled: false
      bukkit:
        defaultMode: "0664"
        enabled: true
        expandObjectName: true
        mountPath: /config/bukkit.yml
        objectName: settings
        subPath: bukkit.yml
        type: configmap
      data:
        enabled: true
        size: {{ .Values.diskSpace }}
        storageClass: {{ .Values.storageClass }}
        type: pvc
      paper:
        defaultMode: "0664"
        enabled: true
        expandObjectName: true
        mountPath: /config/paper.yml
        objectName: settings
        subPath: paper.yml
        type: configmap
      paper-global:
        defaultMode: "0664"
        enabled: true
        expandObjectName: true
        mountPath: /config/config/paper-global.yml
        objectName: settings
        subPath: paper-global.yml
        type: configmap
      purpur:
        defaultMode: "0664"
        enabled: true
        expandObjectName: true
        mountPath: /config/purpur.yml
        objectName: settings
        subPath: purpur.yml
        type: configmap
    portal:
      open:
        enabled: false
    resources:
      limits:
        cpu: 2500m
        memory: 8Gi
